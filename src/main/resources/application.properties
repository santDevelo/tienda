spring.application.name=tienda

server.port=${PORT:8081}

logging.pattern.dateformat=hh:mm

spring.main.banner-mode=off

spring.thymeleaf.cache=false


#Driver y plataforma de comunicación
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
 
#mostrar información en el log
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.type.descriptor.sql.BasicBinder=TRACE

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

#Configuración del firebase

# Firebase Storage
firebase.bucket.name=${FIREBASE_BUCKET_NAME:techshop-5453d.firebasestorage.app}
firebase.storage.path=${FIREBASE_STORAGE_PATH:techshop}

# Credenciales Firebase
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:secrets/techshop-5453d-firebase-adminsdk-fbsvc-7b35482f65.json}


